[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "dental-clinic-analytics"
version = "0.1.0"
description = "Checked reporting for a three-branch dental group"
requires-python = ">=3.12"

[tool.setuptools]
packages = ["dental_analytics"]

[tool.setuptools.package-dir]
dental_analytics = "code"

[tool.setuptools.package-data]
dental_analytics = ["reports.sql"]

[tool.black]
line-length = 99
target-version = ["py312"]
include = '\.py$'
preview = true
enable-unstable-feature = ["string_processing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

